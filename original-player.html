<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinoflex — Оригинальная дорожка</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var kp = p.get('kinopoisk') || p.get('kp') || p.get('id') || '';
  if (!kp) {
    document.body.innerHTML = '<p style="color:#999;font-family:sans-serif;padding:20px">Нужен kinopoisk ID</p>';
    return;
  }
  // Чистый iframe как в API — без лишней обёртки
  var iframe = document.createElement('iframe');
  iframe.src = 'https://smotrimfilms.lovable.app/kp/' + encodeURIComponent(kp);
  iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
  iframe.allowFullscreen = true;
  iframe.setAttribute('allowfullscreen', '');
  document.body.appendChild(iframe);
})();
</script>
</body>
</html>
