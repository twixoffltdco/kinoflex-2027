<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinoflex — Оригинальная дорожка</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0a12;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#e2e8f0}
#wrap{position:absolute;inset:0;display:flex;flex-direction:column}
#bar{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:8px 10px;background:rgba(12,10,26,.95);border-bottom:1px solid rgba(139,92,246,.25);
  z-index:30;
}
#bar .label{font-size:11px;color:#a78bfa;margin-right:4px;white-space:nowrap}
#bar button{
  background:rgba(255,255,255,.06);color:#e2e8f0;border:1px solid rgba(255,255,255,.1);
  border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;transition:.15s;
}
#bar button:hover{background:rgba(139,92,246,.25);border-color:rgba(139,92,246,.5)}
#bar button.active{background:#8b5cf6;border-color:#8b5cf6;color:#fff;font-weight:600}
#stage{flex:1;position:relative;background:#000;min-height:0}
#stage iframe,#stage video,#playerjs-container{
  position:absolute;inset:0;width:100%;height:100%;border:0;background:#000
}
#status{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#94a3b8;font-size:14px;text-align:center;padding:24px;z-index:5;background:#0a0a12
}
#status.hidden{display:none}
.spinner{
  width:36px;height:36px;border:3px solid rgba(139,92,246,.25);border-top-color:#8b5cf6;
  border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px
}
@keyframes spin{to{transform:rotate(360deg)}}
#hint{position:absolute;bottom:8px;left:8px;right:8px;z-index:25;font-size:11px;color:#64748b;pointer-events:none;text-align:center}
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <span class="label">Kinoflex · дорожки</span>
    <div id="btns"></div>
  </div>
  <div id="stage">
    <div id="status"><div><div class="spinner"></div><div id="statusText">Загрузка…</div></div></div>
    <div id="playerjs-container"></div>
  </div>
</div>
<script src="./playerjs.js"></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var kp = params.get('kinopoisk') || params.get('kp') || params.get('id') || '';
  var type = params.get('type') || 'films'; // films | serials
  var statusEl = document.getElementById('status');
  var statusText = document.getElementById('statusText');
  var btns = document.getElementById('btns');
  var box = document.getElementById('playerjs-container');

  function setStatus(msg, hide){
    statusText.textContent = msg || '';
    statusEl.classList.toggle('hidden', !!hide);
  }
  function clearStage(){
    box.innerHTML = '';
    // remove leftover iframes/videos except container
    Array.prototype.slice.call(document.getElementById('stage').querySelectorAll('iframe,video')).forEach(function(el){
      if (el.id !== 'playerjs-container') el.remove();
    });
  }
  function playIframe(url){
    clearStage();
    setStatus('', true);
    var iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
    iframe.setAttribute('allowfullscreen','');
    iframe.setAttribute('frameborder','0');
    iframe.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0';
    document.getElementById('stage').appendChild(iframe);
  }
  function playFile(file){
    clearStage();
    setStatus('', true);
    try{
      if (typeof Playerjs !== 'undefined'){
        box.style.display = 'block';
        new Playerjs({ id: 'playerjs-container', file: file, autoplay: 1 });
      } else {
        var v = document.createElement('video');
        v.controls = true; v.autoplay = true; v.playsInline = true; v.src = file;
        v.style.cssText = 'position:absolute;inset:0;width:100%;height:100%';
        document.getElementById('stage').appendChild(v);
      }
    }catch(e){
      setStatus('Ошибка плеера: ' + (e.message||e));
    }
  }

  function candidates(id){
    // Эти iframe — полноценные плееры с сезонами/сериями (как «оригинальная дорожка»)
    return [
      { name: 'Оригинал', url: 'https://smotrimfilms.lovable.app/kp/' + encodeURIComponent(id) },
      { name: 'Smotrim', url: 'https://smotrimfilms.lovable.app/kp/' + encodeURIComponent(id) },
      { name: 'Tatnet LIVE', url: 'https://live.tatnet.app/live/player.html?kinopoisk=' + encodeURIComponent(id) },
      { name: 'CdnHub', url: 'https://cdnhubvideo.vercel.app/#kp/' + encodeURIComponent(id) }
    ];
  }

  async function fromKinobox(id){
    try{
      var url = 'https://api.kinobox.tv/api/players?kinopoisk=' + encodeURIComponent(id);
      var res = await fetch(url, { signal: AbortSignal.timeout(7000) });
      if(!res.ok) return [];
      var json = await res.json();
      if(!json || !json.data) return [];
      return json.data.filter(function(x){ return x && x.iframeUrl; }).map(function(x){
        var tr = (x.translations && x.translations[0]) ? (' · ' + (x.translations[0].name||'')) : '';
        return { name: (x.type||'Источник') + tr, url: x.iframeUrl, file: null };
      });
    }catch(e){ return []; }
  }

  function render(list){
    btns.innerHTML = '';
    list.forEach(function(item, i){
      var b = document.createElement('button');
      b.textContent = item.name;
      if(i===0) b.classList.add('active');
      b.onclick = function(){
        Array.prototype.forEach.call(btns.querySelectorAll('button'), function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        load(item);
      };
      btns.appendChild(b);
    });
  }

  function load(item){
    setStatus('Подключение: ' + item.name + '…');
    if(item.file) playFile(item.file);
    else playIframe(item.url);
  }

  async function init(){
    if(!kp){
      setStatus('Укажите kinopoisk ID: original-player.html?kinopoisk=7283766');
      return;
    }
    setStatus('Поиск дорожек для KP ' + kp + '…');
    var api = await fromKinobox(kp);
    var list = api.concat(candidates(kp));
    // unique by url
    var seen = {}, out = [];
    list.forEach(function(x){
      if(!x.url || seen[x.url]) return;
      seen[x.url] = 1;
      out.push(x);
    });
    if(!out.length){
      setStatus('Дорожки не найдены');
      return;
    }
    // Первым всегда наш «Оригинал» (smotrim — рабочий JS-плеер с сериями)
    render(out);
    load(out[0]);
  }
  init();
})();
</script>
</body>
</html>
